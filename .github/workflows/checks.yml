name: Source checks

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Python syntax
        run: python3 -m compileall -q native scripts tests work/scripts
      - name: Published files
        run: python3 scripts/check_public_tree.py
      - name: Python tests
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Protocol smoke test
        run: |
          cc -std=c11 -Wall -Wextra -Werror native/protocol_smoke.c -o /tmp/basalt-protocol-smoke
          /tmp/basalt-protocol-smoke
